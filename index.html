  <script>
  (()=>{'use strict';
    const BANK=JSON.parse(document.querySelector('#question-data').textContent);
    const T=[{id:'T1',title:'Tema 1',name:'Aplicaciones multiplataforma',icon:'⌘',detail:'Nativa, híbrida, PWA, Ionic y frameworks.'},{id:'T2A',title:'Tema 2.1',name:'Multimedia y streaming',icon:'◉',detail:'AVOD, protocolos, jitter, CDN y Netflix.'},{id:'T2B',title:'Tema 2.2',name:'Almacenamiento y arquitecturas',icon:'▤',detail:'RAID, formatos, cálculos y procesadores.'},{id:'T3A',title:'Tema 3.1',name:'Dispositivos y conectividad',icon:'◈',detail:'Wearables, pantallas, Bluetooth y NFC.'},{id:'T3B',title:'Tema 3.2',name:'Telefonía celular',icon:'▥',detail:'Clústeres, handover, tráfico y Erlangs.'},{id:'T4',title:'Tema 4',name:'OpenAPI',icon:'{}',detail:'Concepto fundamental de OpenAPI.'}];
    const KEY='dism-test-progress-v1',SESSION_KEY='dism-test-session-v1';
    const $=s=>document.querySelector(s);let saved={attempts:{},history:[]},session=null,screen='home',position=0,reviewFilter='wrong',lastResults=null,installPrompt=null;
    const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const shuffled=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const getTopic=id=>T.find(t=>t.id===id);
    const duration=seconds=>seconds>=60?`${Math.floor(seconds/60)} min ${seconds%60} s`:`${seconds} s`;
    function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
    function storeSession(){try{if(session)localStorage.setItem(SESSION_KEY,JSON.stringify({session,position}));else localStorage.removeItem(SESSION_KEY)}catch(e){}}
    try{const val=JSON.parse(localStorage.getItem(KEY)||'null');if(val&&typeof val==='object'&&val.attempts&&Array.isArray(val.history)){saved=val}}catch(e){}
    try{const v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(v?.session?.ids&&v.session.ids.every(id=>BANK.some(x=>x.id===id))){session=v.session;position=Math.min(Math.max(0,v.position||0),session.ids.length-1)}}catch(e){}
    function countFor(id){return BANK.filter(x=>x.topic===id).length}
    function stats(){const a=Object.values(saved.attempts);return {seen:a.length,mastered:a.filter(x=>x.correct>0).length,wrong:a.filter(x=>x.lastWrong).length,totalTests:saved.history.length}}
    function topicStats(id){const b=BANK.filter(x=>x.topic===id);const seen=b.filter(x=>saved.attempts[x.id]).length;const mastered=b.filter(x=>saved.attempts[x.id]?.correct>0).length;const wrong=b.filter(x=>saved.attempts[x.id]?.lastWrong).length;return {seen,mastered,wrong,total:b.length}}
    function percent(a,b){return b?Math.round(a/b*100):0}
    function progressBar(n,tot){return `<div class="progress" role="progressbar" aria-label="Preguntas ya practicadas" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${tot}"><div class="bar" style="width:${percent(n,tot)}%"></div></div>`}
    function nav(){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('current',x.dataset.nav===screen))}
    function show(which,scroll=true){screen=which;nav();render();if(scroll)window.scrollTo(0,0)}
    function topicCard(t){const a=topicStats(t.id);const counts=[10,20,a.total].filter((x,i,arr)=>arr.indexOf(x)===i&&x<=a.total);if(a.total<10)counts.splice(0,counts.length,a.total);return `<article class="topic"><div class="topic-top"><span class="subject-icon">${html(t.icon)}</span><span class="count">${a.total} preguntas</span></div><div><div class="eyebrow" style="font-size:10px">${html(t.title)}</div><h3>${html(t.name)}</h3><p class="desc">${html(t.detail)}</p></div>${progressBar(a.seen,a.total)}<div class="topic-foot"><div class="topic-actions">${counts.map(n=>`<button class="button tiny ${n===20?'primary':''}" data-action="start" data-topic="${t.id}" data-count="${n}">${n===a.total&&a.total>20?'Todas':a.total===1?'Hacer test':`${n} preguntas`}</button>`).join('')}</div><span class="topic-meta">${a.seen}/${a.total}</span></div></article>`}
    function home(){const a=stats();const recent=saved.history[0];return `<section class="hero"><div class="eyebrow">Tu entrenamiento para el parcial</div><h1>Practica hasta que<br><span style="color:var(--mint)">no te queden dudas.</span></h1><p>${BANK.length} preguntas originales basadas en los temas de DISM, con cálculos, explicaciones y simulacros mezclados. Hecha para practicar desde el móvil.</p><div class="actions"><button class="button primary big" data-action="mixed" data-count="30">Simulacro · 30 preguntas ↗</button><button class="button big" data-action="mixed" data-count="25">Aleatorio · 25 preguntas</button></div><div class="hero-meta"><span><strong>6</strong> bloques</span><span><strong>${BANK.filter(x=>x.kind==='calculo').length}</strong> preguntas de cálculo</span><span><strong>Sin anuncios</strong></span></div></section><div class="stat-grid"><div class="stat"><div class="text">Preguntas vistas</div><div class="num">${a.seen}<span class="small-muted"> / ${BANK.length}</span></div></div><div class="stat"><div class="text">Tests realizados</div><div class="num">${a.totalTests}</div></div><div class="stat"><div class="text">Fallos a repasar</div><div class="num" style="color:${a.wrong?'var(--amber)':'var(--mint)'}">${a.wrong}</div></div></div>${session?`<div class="callout" style="margin-top:17px"><strong>Tienes un test pendiente.</strong> Puedes continuar donde lo dejaste. <button class="button tiny primary" data-action="resume" style="margin-left:8px">Continuar</button></div>`:''}<div class="section-head"><div><h2>Practicar por tema</h2><p>Elige 10, 20 o todas las preguntas del bloque.</p></div></div><div class="topic-grid">${T.map(topicCard).join('')}</div>${recent?`<div class="panel" style="margin-top:25px"><div class="topline"><strong>Último test</strong><span class="small-muted">${new Date(recent.date).toLocaleDateString('es-ES')}</span></div><p style="margin:12px 0 4px"><b>${html(recent.label)}</b> · ${recent.correct}/${recent.total} correctas · ${percent(recent.correct,recent.total)}%</p></div>`:''}<p class="footnote">* La app funciona sin conexión después de abrirla una vez desde su dirección web segura e instalarse. El temario sigue las exclusiones provisionales identificadas por tu compañero; no sustituye las indicaciones oficiales del profesor.</p>`}
    function buildMixed(n){const chosen=[];const all=shuffled(T.filter(t=>t.id!=='T4'));chosen.push(...shuffled(BANK.filter(x=>x.topic==='T4')).slice(0,1));for(let i=0;i<n-1;i++){const t=all[i%all.length];const available=shuffled(BANK.filter(x=>x.topic===t.id&&!chosen.some(c=>c.id===x.id)));if(available.length)chosen.push(available[0]);}return shuffled(chosen).slice(0,n)}
    function startQuiz(topic,count,wrongOnly=false){if(session&&!window.confirm('Hay un test sin terminar. ¿Descartarlo y empezar otro?'))return;let selection;if(wrongOnly){selection=shuffled(BANK.filter(q=>saved.attempts[q.id]?.lastWrong)).slice(0,count)}else if(topic==='mixed'){selection=buildMixed(count)}else{selection=shuffled(BANK.filter(x=>x.topic===topic)).slice(0,count)}if(!selection.length){show('mistakes');return;}session={ids:selection.map(x=>x.id),orders:selection.map(()=>shuffled([0,1,2,3])),answers:Array(selection.length).fill(null),label:wrongOnly?'Repaso de fallos':topic==='mixed'?`Simulacro aleatorio (${count})`:`${getTopic(topic).title} · ${getTopic(topic).name}`,started:Date.now()};position=0;storeSession();show('quiz')}
    function qAt(i){return BANK.find(x=>x.id===session.ids[i])}
    function quiz(){if(!session){return `<div class="empty" style="margin-top:45px">No hay un test activo.<p><button class="button primary" data-action="home">Volver al inicio</button></p></div>`}const q=qAt(position),selected=session.answers[position],completed=session.answers.filter(x=>x!==null).length;return `<section class="quiz-shell"><div class="quiz-head"><div><div class="quiz-eyebrow">${html(session.label)}</div><div class="quiz-title">Pregunta ${position+1} de ${session.ids.length}</div></div><button class="button tiny ghost" data-action="abandon">Salir</button></div><div class="quiz-progress" aria-label="Progreso de preguntas">${session.ids.map((_,i)=>`<i class="${session.answers[i]!==null?'done':i===position?'active':''}"></i>`).join('')}</div><article class="q-card"><div class="question-meta"><span>${completed} respondidas · ${session.ids.length-completed} pendientes</span><span class="type">${q.kind==='calculo'?'✎ Cálculo':'◈ Teoría'}</span></div><h1>${html(q.q)}</h1><div class="opt-list" role="group" aria-label="Opciones de respuesta">${session.orders[position].map((orig,k)=>`<button class="opt ${selected===orig?'selected':''}" data-action="answer" data-option="${orig}" aria-pressed="${selected===orig}"><span class="letter">${'ABCD'[k]}</span><span>${html(q.options[orig])}</span></button>`).join('')}</div><div class="question-bottom"><button class="button tiny ghost" data-action="clear" ${selected===null?'disabled':''}>Borrar respuesta</button><div class="quiz-controls"><button class="button" data-action="prev" ${position===0?'disabled':''}>← Anterior</button><button class="button primary" data-action="next">${position===session.ids.length-1?'Finalizar test':'Siguiente →'}</button></div></div></article><div class="q-jump" aria-label="Ir a otra pregunta">${session.ids.map((x,i)=>`<button class="jump ${i===position?'current':''} ${session.answers[i]!==null?'answered':''}" data-action="jump" data-index="${i}" aria-label="Pregunta ${i+1}${session.answers[i]!==null?', respondida':''}" aria-current="${i===position?'step':'false'}">${i+1}</button>`).join('')}</div><p class="hint">Puedes ir atrás, dejar preguntas en blanco y volver a ellas. Las soluciones aparecen al terminar.</p></section>`}
    function finish(){if(!session)return;const left=session.answers.filter(a=>a===null).length;if(left&&!window.confirm(`Quedan ${left} preguntas sin responder. Se contarán como no acertadas. ¿Finalizar igualmente?`))return;const rows=session.ids.map((id,i)=>{const q=BANK.find(x=>x.id===id);const answer=session.answers[i];return {q,answer,isCorrect:answer===q.correct}});const correct=rows.filter(x=>x.isCorrect).length,answered=rows.filter(x=>x.answer!==null).length;rows.forEach(x=>{if(x.answer===null)return;const a=saved.attempts[x.q.id]||{asked:0,correct:0,wrong:0,lastWrong:false};a.asked++;if(x.isCorrect){a.correct++;a.lastWrong=false}else{a.wrong++;a.lastWrong=true}saved.attempts[x.q.id]=a});const rec={date:new Date().toISOString(),label:session.label,total:rows.length,correct,wrong:answered-correct,blank:rows.length-answered,duration:Math.max(0,Math.floor((Date.now()-session.started)/1000))};saved.history.unshift(rec);saved.history=saved.history.slice(0,100);store();lastResults={rows,rec};session=null;position=0;storeSession();reviewFilter='wrong';show('results')}
    function reviewCard(row,i){const actual=row.answer===null?'Sin responder':row.q.options[row.answer];const type=row.answer===null?'blank':row.isCorrect?'':'wrong';return `<article class="review"><div class="review-head"><span class="tag ${type}">${row.answer===null?'En blanco':row.isCorrect?'✓ Correcta':'✕ Incorrecta'}</span><span class="small-muted">${html(getTopic(row.q.topic).title)} · ${i+1}</span></div><h3>${html(row.q.q)}</h3>${row.isCorrect?`<p class="correctline">Tu respuesta: <strong>${html(actual)}</strong></p>`:`${row.answer!==null?`<p class="wrongline">Tu respuesta: ${html(actual)}</p>`:''}<p class="correctline">Respuesta correcta: <strong>${html(row.q.options[0])}</strong></p>`}<p class="explanation"><strong>Explicación:</strong> ${html(row.q.why)}</p></article>`}
    function results(){if(!lastResults)return `<div class="empty" style="margin-top:35px">No hay un test corregido en esta sesión. Tus notas anteriores están en Progreso.</div>`;const {rows,rec}=lastResults;const filtered=rows.map((x,i)=>({...x,idx:i})).filter(x=>reviewFilter==='all'||!x.isCorrect);return `<section class="quiz-shell"><div class="results-hero"><div class="eyebrow">Test completado</div><h1>${html(rec.label)}</h1><div class="score">${percent(rec.correct,rec.total)}<small>%</small></div><div class="results-grid"><div class="resultmini"><strong style="color:var(--mint)">${rec.correct}</strong><span>Aciertos</span></div><div class="resultmini"><strong style="color:var(--danger)">${rec.wrong}</strong><span>Errores</span></div><div class="resultmini"><strong style="color:var(--amber)">${rec.blank}</strong><span>En blanco</span></div></div><div class="small-muted">${rec.total} preguntas · ${duration(rec.duration)} · Las no respondidas no suman puntos</div></div><div class="toolbar"><button class="button primary" data-action="home">Volver a temas</button><button class="button" data-action="mistakes">Practicar fallos →</button></div><div class="section-head"><div><h2>Corrección explicada</h2><p>Entiende cada error, no memorices solo las letras.</p></div></div><div style="display:flex;gap:8px"><button class="button tiny ${reviewFilter==='wrong'?'primary':''}" data-action="filter" data-filter="wrong">Fallos y blancas (${rows.length-rec.correct})</button><button class="button tiny ${reviewFilter==='all'?'primary':''}" data-action="filter" data-filter="all">Todas (${rows.length})</button></div><div class="review-list">${filtered.length?filtered.map(r=>reviewCard(r,r.idx)).join(''):'<div class="empty">¡Perfecto! No tienes errores en este test.</div>'}</div></section>`}
    function mistakes(){const wrong=BANK.filter(x=>saved.attempts[x.id]?.lastWrong);const byTopic=T.map(t=>({t,items:wrong.filter(x=>x.topic===t.id)}));return `<div class="section-head"><div><div class="eyebrow">Refuerzo inteligente</div><h2>Mis fallos</h2><p>Preguntas que fallaste en tu último intento; desaparecen cuando las aciertas.</p></div></div><div class="panel"><div class="topline"><div><div class="num" style="font-size:39px;font-weight:850;color:var(--amber)">${wrong.length}</div><div class="small-muted">Preguntas pendientes de dominar</div></div><button class="button primary" data-action="retry" ${!wrong.length?'disabled':''}>Repasar ${Math.min(20,wrong.length)}</button></div>${wrong.length?`<p class="hint" style="margin-top:16px">El repaso toma hasta 20 preguntas falladas al azar, mezclando temas. Puedes repetirlo hasta vaciar la lista.</p>`:'<p class="hint" style="margin-top:16px">Todavía no hay preguntas marcadas como falladas. ¡Empieza un test!</p>'}</div><div class="panel"><strong>Fallos por tema</strong>${byTopic.map(({t,items})=>`<div class="listrow"><div><h3>${html(t.title)} · ${html(t.name)}</h3><p>${items.length} pendientes</p></div>${items.length?`<button class="button tiny" data-action="retrytopic" data-topic="${t.id}">Practicar</button>`:'<span class="tag">Al día</span>'}</div>`).join('')}</div>`}
    function progress(){const a=stats();return `<div class="section-head"><div><div class="eyebrow">Datos guardados en este dispositivo</div><h2>Mi progreso</h2><p>Sin cuentas, sin publicidad y sin enviar tus resultados a ningún servidor.</p></div></div><div class="stat-grid"><div class="stat"><div class="text">Vistas</div><div class="num">${a.seen}</div></div><div class="stat"><div class="text">Acertadas alguna vez</div><div class="num">${a.mastered}</div></div><div class="stat"><div class="text">Tests</div><div class="num">${a.totalTests}</div></div></div><div class="panel"><h3 style="margin-top:0">Cobertura por tema</h3>${T.map(t=>{const x=topicStats(t.id);return `<div style="padding:12px 0"><div class="topline" style="margin-bottom:9px"><span style="font-weight:650;font-size:13px">${html(t.title)} · ${html(t.name)}</span><span class="small-muted">${x.seen}/${x.total} vistas</span></div>${progressBar(x.seen,x.total)}<div class="small-muted" style="margin-top:5px">${x.mastered} acertadas al menos una vez · ${x.wrong} por repasar</div></div>`}).join('')}</div><div class="panel"><h3 style="margin-top:0">Últimos intentos</h3>${saved.history.length?saved.history.slice(0,12).map(h=>`<div class="listrow"><div><h3>${html(h.label)}</h3><p>${new Date(h.date).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})} · ${h.total} preguntas · ${duration(h.duration)}</p></div><div class="right" style="color:${percent(h.correct,h.total)>=70?'var(--mint)':'var(--amber)'}">${percent(h.correct,h.total)}%</div></div>`).join(''):'<div class="empty" style="margin-top:12px">Tus intentos aparecerán aquí al terminar los tests.</div>'}</div><div class="panel"><h3 style="margin:0 0 7px">Copia de tus resultados</h3><p class="hint">Exporta un archivo JSON por si cambias de teléfono o navegador. También puedes restaurarlo.</p><div class="actions" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="button" data-action="export">Exportar progreso</button><label class="button file-label" tabindex="0">Importar progreso <input id="importfile" type="file" accept=".json,application/json"></label><button class="button danger" data-action="reset">Borrar estadísticas</button></div></div>`}
    function info(){return `<div class="section-head"><div><div class="eyebrow">Información de estudio</div><h2>Sobre DISM Test</h2><p>Cómo funciona y qué contenidos se han usado.</p></div></div><div class="panel"><h3>¿Qué incluye?</h3><ul class="info-list"><li><strong>${BANK.length} preguntas</strong> nuevas, con cuatro alternativas y una explicación de la correcta.</li><li><strong>Tests por tema:</strong> de 10, 20 o el banco completo, según las preguntas disponibles.</li><li><strong>Simulacros mixtos:</strong> 25 o 30 preguntas de los seis bloques; se incluye la de OpenAPI.</li><li><strong>Repaso de fallos:</strong> las preguntas que fallas quedan pendientes hasta que las aciertes.</li><li><strong>Cálculos:</strong> conviene resolverlos en papel antes de escoger respuesta, como en el examen anterior.</li></ul></div><div class="panel"><h3>Alcance del temario</h3><p class="hint">El contenido procede del resumen elaborado a partir de los seis PDFs docentes de DISM y una comparación pública de guías publicada por otro estudiante. No disponemos de la guía oficial original del profesor. Se han omitido los apartados considerados excluidos de forma <strong>provisional</strong>.</p><p class="hint">OpenAPI se limita a su definición. No se incluyen ejercicios de Erlang B, generaciones móviles, versiones de Bluetooth ni funcionamiento interno de Flutter/PWA.</p><p class="hint">No se han copiado preguntas de la web de tu compañero. Este banco es una elaboración independiente basada en los conceptos del temario.</p></div><div class="panel"><h3>Uso sin conexión e instalación</h3><ul class="info-list"><li>Para instalar como app, publica la carpeta de la web en un servidor HTTPS (por ejemplo GitHub Pages).</li><li>En Android abre la dirección en Chrome y elige «Instalar aplicación» o «Añadir a pantalla de inicio».</li><li>En iPhone abre la web con Safari, toca Compartir y elige «Añadir a pantalla de inicio».</li><li>Una vez cargados y guardados los archivos de la app, la PWA permite seguir haciendo tests sin conexión.</li><li>Los resultados se guardan únicamente en el navegador de cada dispositivo. No se sincronizan entre móviles.</li></ul></div><div class="callout">Esta herramienta es un apoyo de estudio independiente; no es un producto oficial de la Universidad de Alicante ni una predicción del examen.</div>`}
    function render(){const app=$('#app');app.innerHTML=screen==='home'?home():screen==='quiz'?quiz():screen==='results'?results():screen==='mistakes'?mistakes():screen==='progress'?progress():info();$('#bottom-nav').classList.toggle('hide',screen==='quiz'||screen==='results')}
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const act=el.dataset.action;if(act==='home'){if(screen==='quiz'&&session){show('home')}else show('home')}
      else if(act==='mixed')startQuiz('mixed',Number(el.dataset.count));
      else if(act==='start')startQuiz(el.dataset.topic,Number(el.dataset.count));
      else if(act==='resume')show('quiz');
      else if(act==='answer'){if(!session)return;session.answers[position]=Number(el.dataset.option);storeSession();render()}
      else if(act==='clear'){if(!session)return;session.answers[position]=null;storeSession();render()}
      else if(act==='jump'){position=Number(el.dataset.index);storeSession();show('quiz',false)}
      else if(act==='prev'){position=Math.max(position-1,0);storeSession();show('quiz',false)}
      else if(act==='next'){if(position===session.ids.length-1)finish();else{position++;storeSession();show('quiz',false)}}
      else if(act==='abandon'){show('home')}
      else if(act==='filter'){reviewFilter=el.dataset.filter;render()}
      else if(act==='mistakes'||act==='progress'||act==='info')show(act);
      else if(act==='retry'){startQuiz('wrong',Math.min(20,BANK.filter(q=>saved.attempts[q.id]?.lastWrong).length),true)}
      else if(act==='retrytopic'){const arr=shuffled(BANK.filter(q=>q.topic===el.dataset.topic&&saved.attempts[q.id]?.lastWrong));if(!arr.length)return;if(session&&!confirm('¿Descartar el test pendiente?'))return;session={ids:arr.map(x=>x.id),orders:arr.map(()=>shuffled([0,1,2,3])),answers:Array(arr.length).fill(null),label:`Repaso · ${getTopic(el.dataset.topic).title}`,started:Date.now()};position=0;storeSession();show('quiz')}
      else if(act==='reset'){if(confirm('¿Borrar todas las estadísticas e historial de tests de este dispositivo? Esta acción no se puede deshacer.')){saved={attempts:{},history:[]};store();show('progress')}}
      else if(act==='export'){const blob=new Blob([JSON.stringify({app:'dism-test',version:1,exported:new Date().toISOString(),data:saved},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='DISM_Test_progreso.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
      else if(act==='install'){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>{installPrompt=null;$('#install-btn').classList.add('hide')})}else show('info')}
    });
    document.addEventListener('change',async e=>{if(e.target.id!=='importfile')return;const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='dism-test'||data.version!==1||!data.data||typeof data.data.attempts!=='object'||!Array.isArray(data.data.history))throw Error('Formato no válido');if(!confirm('¿Importar este progreso y reemplazar tus estadísticas actuales?'))return;saved=data.data;store();show('progress');alert('Progreso importado correctamente.')}catch(err){alert('No se ha podido importar: el archivo no tiene el formato esperado.')}});
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install-btn').classList.remove('hide')});
    window.addEventListener('online',()=>$('#online-label').innerHTML='<span class="status-dot"></span>Disponible sin conexión*');
    window.addEventListener('offline',()=>$('#online-label').innerHTML='<span class="status-dot"></span>Sin conexión');
    if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname)))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    render();
  })();
  </script>
</body>
